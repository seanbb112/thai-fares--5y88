name: Hourly flight sweep

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub can run a few minutes late)
  workflow_dispatch:       # "Run workflow" button for a manual update
  push:                    # code or config changes run a sweep straight away
    branches: [main]
    paths-ignore: ["data/**", "dashboard/data.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search Google Flights
        run: |
          set -o pipefail
          python tracker/tracker.py 2>&1 | tail -n 40 > data/ci-output.log
        continue-on-error: true   # a failed sweep still saves its log and keeps the last good page up

      - name: Save price history
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add data dashboard/data.js
          git diff --cached --quiet || git commit -m "Sweep $(TZ=Europe/Dublin date '+%d/%m/%y %H:%M')"
          # if another run saved first, keep this run's data files and retry
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
