name: Hourly flight sweep

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub can run a few minutes late)
  workflow_dispatch:       # "Run workflow" button for a manual update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search Google Flights
        run: python tracker/tracker.py

      - name: Save price history
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add data dashboard/data.js
          git diff --cached --quiet || git commit -m "Sweep $(TZ=Europe/Dublin date '+%d/%m/%y %H:%M')"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
