name: Flight sweep

on:
  schedule:
    - cron: "5 */2 * * *"     # full search: every 2 hours at :05 (UTC; GitHub can run late)
    - cron: "35 * * * *"      # quick check: every hour at :35 ...
    - cron: "5 1-23/2 * * *"  # ... and at :05 on the odd hours, so quick runs every 30 min
  workflow_dispatch:          # "Run workflow" button for a manual update
    inputs:
      mode:
        description: "quick (5 watched routes, ~1 min) or full (every route, ~12 min)"
        type: choice
        options: [quick, full]
        default: quick
  push:                       # code or config changes run a full search straight away
    branches: [main]
    paths-ignore: ["data/**", "dashboard/data.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick search mode
        id: mode
        run: |
          MODE=full
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "5 */2 * * *" ]; then MODE=quick; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Search Google Flights
        run: |
          set -o pipefail
          FLAG=""; [ "${{ steps.mode.outputs.mode }}" = "quick" ] && FLAG="--quick"
          python tracker/tracker.py $FLAG 2>&1 | tail -n 40 > data/ci-output.log
        continue-on-error: true   # a failed sweep still saves its log and keeps the last good page up

      - name: Save price history
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add data dashboard/data.js
          git diff --cached --quiet || git commit -m "Sweep (${{ steps.mode.outputs.mode }}) $(TZ=Europe/Dublin date '+%d/%m/%y %H:%M')"
          # if another run saved first, keep this run's data files and retry
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
